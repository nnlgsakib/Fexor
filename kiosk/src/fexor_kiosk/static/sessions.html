<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Fexor Kiosk</title>
<style>
  /* Same identity as the kiosk screen: ledger green, card stock, brass for the main action. */
  @font-face { font-family: "Shoulders"; src: url("/static/fonts/big-shoulders-800.woff2") format("woff2"); font-weight: 800; font-display: swap; }
  @font-face { font-family: "Schibsted"; src: url("/static/fonts/schibsted-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Schibsted"; src: url("/static/fonts/schibsted-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Schibsted"; src: url("/static/fonts/schibsted-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  :root {
    --ground: #0e3b31; --ground-deep: #0a2c25; --ground-line: #2a5a4e; --card: #e9f0eb; --ink: #0f2620;
    --ink-soft: #4a5f58; --on-ground: #e9f0eb; --on-ground-soft: #a9c2b9; --brass: #e8b54a; --bad: #b8402c;
    font-family: "Schibsted", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ground); color: var(--on-ground); }
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px clamp(16px, 3vw, 36px);
    border-bottom: 1px solid var(--ground-line); font-size: 18px; }
  header b { font-weight: 600; }
  .clock { font-family: "Shoulders", "Arial Narrow", sans-serif; font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; }
  main { width: min(760px, 92vw); margin: clamp(20px, 5vh, 48px) auto; display: grid; gap: 16px; }
  h1 { margin: 0; font-family: "Shoulders", "Arial Narrow", sans-serif; font-weight: 800; font-size: clamp(40px, 8vh, 60px); line-height: 1; }
  main > p { margin: 0; color: var(--on-ground-soft); font-size: 17px; line-height: 1.45; max-width: 40em; }
  .list { display: grid; gap: 12px; }
  .item { background: var(--card); color: var(--ink); border-radius: 16px; padding: 18px 20px;
    display: flex; align-items: center; gap: 16px; }
  .item .info { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .item .name { font-size: 21px; font-weight: 700; }
  .item .meta { color: var(--ink-soft); font-size: 15px; overflow-wrap: anywhere; }
  .item .new { color: #8a5a00; font-weight: 600; }
  .item .side { display: grid; gap: 10px; justify-items: end; }
  button { font: inherit; font-weight: 700; border-radius: 14px; border: 0; cursor: pointer; min-height: 48px;
    font-size: 18px; padding: 0 22px; }
  button.big { min-height: 60px; font-size: 20px; padding: 0 28px; }
  .item button.big { background: var(--ground); color: var(--card); }
  .item .del { background: transparent; color: var(--bad); border: 1.5px solid #c9b2ab; font-size: 15px;
    min-height: 44px; padding: 0 14px; font-weight: 600; }
  .actions button.big:first-child { background: var(--brass); color: var(--ink); }
  .ghost { background: transparent; color: var(--on-ground); border: 1.5px solid var(--ground-line); font-weight: 600; }
  button:active { transform: scale(.98); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .empty { color: var(--on-ground-soft); padding: 24px; border: 1.5px dashed var(--ground-line); border-radius: 16px; text-align: center; font-size: 17px; }
  /* After a power cut nobody is there to tap: the last session opens by itself. */
  .auto { background: var(--brass); color: var(--ink); border-radius: 16px; padding: 12px 14px 12px 20px;
    display: flex; gap: 16px; align-items: center; justify-content: space-between; font-size: 19px; font-weight: 600; }
  .auto button { background: transparent; color: var(--ink); border: 1.5px solid rgba(15, 38, 32, .35); }
  .busy { position: fixed; inset: 0; background: rgba(10, 44, 37, .9); display: grid; place-items: center;
    font-family: "Shoulders", "Arial Narrow", sans-serif; font-size: 44px; font-weight: 800; }
  .hidden { display: none !important; }
  .err { color: #f2a493; min-height: 1.2em; font-size: 16px; }
  @media (max-height: 520px) { main { margin: 14px auto; gap: 10px; } h1 { font-size: 36px; } .item { padding: 12px 16px; } }
  @media (max-width: 520px) { .item { flex-wrap: wrap; } .item .side { width: 100%; grid-auto-flow: column; justify-content: start; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } button:active { transform: none; } }
</style>
</head>
<body>
<header><b>Fexor Kiosk</b><span class="clock" id="clock">--:--</span></header>
<main>
  <h1>Choose a session</h1>
  <p>A session is this kiosk's connection to one server and space. Open a saved one, or start a
    new one to connect to another server or space.</p>
  <div class="auto hidden" id="auto"><span id="autoText"></span><button class="ghost" id="autoStop">Stay here</button></div>
  <div class="list" id="list"></div>
  <div class="err" id="err"></div>
  <div class="actions">
    <button class="big" id="newBtn">New session</button>
    <button class="big ghost" id="exitBtn">Exit app</button>
  </div>
</main>
<div class="busy hidden" id="busy">Opening…</div>

<script>
const $ = (id) => document.getElementById(id);
setInterval(tick, 1000); tick();
function tick() { $("clock").textContent = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}); }

function ago(seconds) {
  const m = Math.round(seconds / 60), h = Math.round(seconds / 3600), d = Math.round(seconds / 86400);
  if (m < 2) return "just now";
  if (m < 60) return `${m} minutes ago`;
  if (h < 36) return `${h} hours ago`;
  return `${d} days ago`;
}

async function call(method, path) {
  const r = await fetch(path, {method});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || "Something went wrong");
  return body;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function load() {
  const {sessions, now, auto_open, auto_open_seconds} = await call("GET", "/api/sessions");
  const list = $("list");
  list.innerHTML = "";
  if (!sessions.length) list.append(el("div", "empty", "No saved sessions yet. Start a new one to connect this kiosk."));
  for (const s of sessions) {
    const item = el("div", "item");
    const info = el("div", "info");
    info.append(el("div", "name", s.space || "Not connected yet"));
    if (s.paired) {
      info.append(el("div", "meta", `Kiosk: ${s.kiosk || "–"}`));
      info.append(el("div", "meta", `Server: ${s.server || "–"}`));
    } else {
      info.append(el("div", "meta new", "Setup was started but not finished."));
    }
    info.append(el("div", "meta", `Last used ${ago(now - s.last_used)}`));
    const side = el("div", "side");
    const open = el("button", "big", s.paired ? "Open" : "Continue setup");
    open.onclick = () => go("POST", `/api/sessions/${s.id}/open`, s.space || "setup");
    const del = el("button", "danger del", "Delete…");  // small and apart from Open: no mis-taps
    del.onclick = () => remove(s);
    side.append(open, del);
    item.append(info, side);
    list.append(item);
  }
  startAutoOpen(sessions.find((s) => s.id === auto_open), auto_open_seconds);
}

// After a reboot or power cut nobody is there to tap Open: start the last session by itself.
// Any touch, click or key press stops the countdown.
let autoTimer = null;
function stopAutoOpen() {
  clearInterval(autoTimer); autoTimer = null;
  $("auto").classList.add("hidden");
}
function startAutoOpen(session, seconds) {
  stopAutoOpen();
  if (!session) return;
  let left = seconds;
  const show = () => { $("autoText").textContent = `Opening ${session.space || "the last session"} in ${left} s…`; };
  show();
  $("auto").classList.remove("hidden");
  autoTimer = setInterval(() => {
    left -= 1;
    if (left > 0) { show(); return; }
    stopAutoOpen();
    go("POST", `/api/sessions/${session.id}/open`, session.space || "setup");
  }, 1000);
}
["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, stopAutoOpen, {capture: true}));
$("autoStop").onclick = stopAutoOpen;

async function go(method, path, what) {
  $("err").textContent = "";
  $("busy").textContent = what === "setup" ? "Starting setup…" : `Opening ${what}…`;
  $("busy").classList.remove("hidden");
  try { await call(method, path); } catch (e) {
    $("busy").classList.add("hidden"); $("err").textContent = e.message; return;
  }
  // The kiosk replaces this list on the same address; reload once it answers.
  for (let i = 0; i < 300; i++) {
    await new Promise((r) => setTimeout(r, 300));
    try {
      const s = await (await fetch("/api/status")).json();
      if (s.mode !== "sessions") { location.reload(); return; }
    } catch { /* switching */ }
  }
  location.reload();
}

async function remove(s) {
  const name = s.space || "this unfinished setup";
  if (!confirm(`Delete the session for ${name}? This kiosk forgets the connection and any check-ins it hasn't uploaded yet. The server keeps everything it already has.`)) return;
  try { await call("DELETE", `/api/sessions/${s.id}`); await load(); stopAutoOpen(); } catch (e) { $("err").textContent = e.message; }
}

$("newBtn").onclick = () => go("POST", "/api/sessions", "setup");
$("exitBtn").onclick = async () => {
  if (!confirm("Close the kiosk app? People can't check in until it is started again.")) return;
  try { await call("POST", "/api/quit"); } catch (e) { $("err").textContent = e.message; }
};
load().catch((e) => { $("err").textContent = e.message; });
</script>
</body>
</html>
