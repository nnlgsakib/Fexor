# Settings for the Fexor Kiosk app. Most people never need to change these:
# the camera and the server are chosen on the kiosk screen.

# 1 = Raspberry Pi camera module on the ribbon cable (needs: sudo apt install libcamera-v4l2)
PI_CAMERA_MODULE=0

# Fixed camera number or stream URL, overriding the on-screen choice. Empty = use the screen.
FEXOR_KIOSK_CAMERA=

# CA certificate file, only for servers that use a private certificate.
FEXOR_KIOSK_CA=
