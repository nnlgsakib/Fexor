# Fexor server. Easiest: run "Start Server" from the project folder; it writes .env for you.
# Manual: copy deploy/.env.example to deploy/.env, fill it in, then: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fexor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: fexor
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fexor"]
      interval: 5s
      retries: 20

  server:
    build: { context: .., dockerfile: Dockerfile }
    image: fexor-server:latest
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: &env
      FEXOR_DATABASE_URL: postgresql+asyncpg://fexor:${POSTGRES_PASSWORD}@db:5432/fexor
      FEXOR_DATA_KEY: ${FEXOR_DATA_KEY:?set FEXOR_DATA_KEY (fexor-server gen-key)}
      FEXOR_SECURE_COOKIES: ${FEXOR_SECURE_COOKIES:-true}
      FEXOR_PUBLIC_URL: ${FEXOR_PUBLIC_URL:-}
      FORWARDED_ALLOW_IPS: "*"

  worker:
    image: fexor-server:latest
    restart: unless-stopped
    depends_on: [server]
    environment: *env
    command: ["fexor-server", "worker"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    ports: ["80:80", "443:443"]
    environment:
      FEXOR_DOMAIN: ${FEXOR_DOMAIN:-localhost}
      FEXOR_TLS: ${FEXOR_TLS:-internal}
    volumes:
      # Caddyfile = HTTPS with a domain; Caddyfile.http = office network, plain HTTP
      - ./${FEXOR_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  db:
  caddy:
