[project]
name = "fexor"
version = "0.1.0"
description = "Multi-purpose attendance system: admin server + edge kiosk with face verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fexor-core", "fexor-server", "fexor-kiosk"]

[tool.uv.workspace]
members = ["core", "server", "kiosk"]

[tool.uv.sources]
fexor-core = { workspace = true }
fexor-server = { workspace = true }
fexor-kiosk = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.28"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "server/tests", "kiosk/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
