[project]
name = "fexor-core"
version = "0.1.0"
description = "Shared face, liveness, QR and crypto primitives for Fexor"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
    "cryptography>=44",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
