# Fexor server: database, API + admin panel, background worker, web front.
# Easiest: run "Start Server" from the project folder; it writes .env for you.
# Manual: copy .env.example to .env, fill it in, then:  docker compose up -d
#
# Three ways to reach it (set in .env):
#   office network   FEXOR_CADDYFILE=Caddyfile.http                          plain HTTP, port 80
#   own domain       FEXOR_CADDYFILE=Caddyfile                               HTTPS via Let's Encrypt
#   Cloudflare       FEXOR_CADDYFILE=Caddyfile.http + COMPOSE_PROFILES=tunnel + CF_TUNNEL_TOKEN
#                    HTTPS through a Cloudflare Tunnel, no router ports to open
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fexor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: fexor
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fexor"]
      interval: 5s
      retries: 20

  server:
    # Published image; `docker compose up --build` builds it from this folder instead.
    image: ${FEXOR_IMAGE:-ghcr.io/nnlgsakib/fexor-server:latest}
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: &env
      FEXOR_DATABASE_URL: postgresql+asyncpg://fexor:${POSTGRES_PASSWORD}@db:5432/fexor
      FEXOR_DATA_KEY: ${FEXOR_DATA_KEY:?set FEXOR_DATA_KEY}
      FEXOR_SECURE_COOKIES: ${FEXOR_SECURE_COOKIES:-true}
      FEXOR_PUBLIC_URL: ${FEXOR_PUBLIC_URL:-}
      FORWARDED_ALLOW_IPS: "*"

  worker:
    image: ${FEXOR_IMAGE:-ghcr.io/nnlgsakib/fexor-server:latest}
    restart: unless-stopped
    depends_on: [server]
    environment: *env
    command: ["fexor-server", "worker"]
    healthcheck:
      disable: true  # the image's check is for the web server; the worker serves no HTTP

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    ports: ["80:80", "443:443"]
    environment:
      FEXOR_DOMAIN: ${FEXOR_DOMAIN:-localhost}
      FEXOR_TLS: ${FEXOR_TLS:-internal}
    volumes:
      - ./${FEXOR_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy:/data

  cloudflared:
    # Only with COMPOSE_PROFILES=tunnel. In the Cloudflare dashboard (Zero Trust, Networks,
    # Tunnels) create a tunnel, add a public hostname pointing to http://caddy:80, and put
    # its token in CF_TUNNEL_TOKEN.
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [caddy]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}

volumes:
  db:
  caddy:
